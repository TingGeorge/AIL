<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ALL in life" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <title>ALL in life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" />
    <style>
      /* FUTUREMODE-derived system: achromatic UI, one accent from the event signage. */
      :root {
        --fm-black: #000000;
        --fm-white: #ffffff;
        --fm-off-white: #f5f5f5;
        --fm-line: #e7e7e7;
        --fm-control: #d9d9d9;
        --fm-muted: #bbbbbb;
        --fm-light-line: rgba(255, 255, 255, 0.3);
        --fm-accent: #e4ff1a; /* acid yellow: BUILDMODE wall, FM26 discs */

        --font-ui: "Neue Montreal", "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
        --font-btn: Poppins, "PingFang TC", "Microsoft JhengHei", sans-serif;

        --text-display: clamp(2.6rem, 11vw, 4.25rem);
        --text-section: clamp(1.81rem, 2.55vw, 2.3rem);
        --text-lead: clamp(1.27rem, 1.6vw, 1.43rem);
        --text-body: 1rem;
        --text-label: 0.75rem;

        --gutter: clamp(20px, 3vw, 43px);
        --space-sm: 16px;
        --space-md: 24px;
        --space-lg: 48px;
        --space-xl: 64px;

        --ink: var(--fm-white);
        --surface: var(--fm-black);
        --rule: var(--fm-light-line);
        --muted: var(--fm-muted);
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--fm-black);
        color: var(--fm-white);
        font-family: var(--font-ui);
        font-size: var(--text-body);
        line-height: 1.35;
        letter-spacing: -0.16px;
      }

      main {
        min-height: 100dvh;
        padding: calc(var(--space-md) + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right))
          calc(var(--space-xl) + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
        background: var(--surface);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
      }
      main[data-surface="white"] {
        --ink: var(--fm-black);
        --surface: var(--fm-white);
        --rule: var(--fm-line);
        --muted: #555555;
      }

      /* Section label + statement */
      .label {
        margin: 0;
        font-size: var(--text-label);
        line-height: 20px;
        font-weight: 500;
        color: var(--muted);
      }
      .statement {
        margin: 0;
        font-size: var(--text-display);
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.19px;
        text-wrap: balance;
      }
      .section-title {
        margin: 0;
        font-size: var(--text-section);
        line-height: 1.33;
        font-weight: 400;
      }
      .lead {
        margin: 0;
        font-size: var(--text-lead);
        line-height: 1.4;
        white-space: pre-wrap;
      }
      .note {
        margin: 0;
        font-size: var(--text-label);
        line-height: 20px;
        color: var(--muted);
      }

      header.bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--space-sm);
      }
      header.bar strong { font-weight: 700; font-size: var(--text-body); }

      section { display: flex; flex-direction: column; gap: 12px; }
      .rows { border-top: 1px solid var(--rule); }
      .row {
        display: grid;
        grid-template-columns: minmax(6.5em, 34%) 1fr;
        gap: var(--space-sm);
        align-items: center;
        min-height: 52px;
        padding: 10px 0;
        border-bottom: 1px solid var(--rule);
      }
      .row > label, .row > .row-label { color: var(--muted); font-size: var(--text-body); }
      .row .value { font-size: var(--text-lead); line-height: 1.3; }
      .row .unlimited { color: var(--muted); }
      .row input, .row select, textarea {
        width: 100%;
        min-height: 44px;
        font: inherit;
        font-size: var(--text-lead);
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--ink);
        border-radius: 0;
        padding: 6px 0;
      }
      textarea {
        font-size: var(--text-body);
        min-height: 112px;
        border: 1px solid var(--rule);
        padding: 12px;
        resize: vertical;
      }
      .row .link { justify-self: start; }

      /* Controls */
      button { font: inherit; color: inherit; cursor: pointer; }
      .mic {
        width: 100%;
        min-height: 128px;
        padding: var(--space-sm);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
        background: var(--fm-black);
        color: var(--fm-white);
        border: 1px solid var(--fm-white);
        border-radius: 0;
        transition: background 120ms ease-out, color 120ms ease-out;
      }
      .mic .mic-kicker { font-size: var(--text-label); line-height: 20px; color: var(--fm-muted); }
      .mic .mic-text { font-size: var(--text-section); line-height: 1.2; font-weight: 700; }
      .mic[data-recording="true"] {
        background: var(--fm-accent);
        color: var(--fm-black);
        border-color: var(--fm-accent);
      }
      .mic[data-recording="true"] .mic-kicker { color: var(--fm-black); }
      .mic:disabled { color: var(--fm-muted); border-color: var(--fm-light-line); cursor: default; }
      .mic:disabled .mic-text { font-weight: 400; }

      .primary {
        width: 100%;
        min-height: 48px;
        padding: 16px 20.8px;
        font-family: var(--font-btn);
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.29px;
        color: var(--fm-black);
        background: var(--fm-control);
        border: 0;
        border-radius: 10px;
        transition: background 120ms ease-out, transform 120ms ease-out;
      }
      .primary:hover:not(:disabled) { background: var(--fm-white); transform: translateY(-1px); }
      .primary:disabled { background: var(--fm-muted); cursor: default; }
      main[data-surface="white"] .primary { background: var(--fm-black); color: var(--fm-white); }

      .link {
        background: none;
        border: 0;
        padding: 12px 0;
        min-height: 44px;
        font-size: var(--text-body);
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-align: left;
      }
      .link.muted { color: var(--muted); }

      .status { margin: 0; min-height: 22px; font-size: var(--text-body); }
      .status.error { color: var(--fm-accent); }
      main[data-surface="white"] .status.error { color: var(--fm-black); }

      /* Chip row (dashboard) */
      .chips {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 0;
        padding: var(--space-sm) 0;
        text-align: left;
        background: none;
        border: 0;
        border-top: 1px solid var(--fm-black);
        border-bottom: 1px solid var(--fm-black);
        border-radius: 0;
        font-size: var(--text-lead);
        line-height: 1.3;
      }
      .chips .chip::after { content: " / "; color: var(--muted); }
      .chips .chip:last-child::after { content: ""; }

      .cat {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: var(--space-sm);
        padding: var(--space-md) 0;
        border-bottom: 1px solid var(--fm-line);
      }
      .cat h2 { margin: 0; font-size: var(--text-section); font-weight: 400; }
      .cat .mark { font-size: var(--text-label); font-weight: 500; padding: 2px 8px; background: var(--fm-accent); color: var(--fm-black); }
      .cat p { grid-column: 1 / -1; margin: 0; color: var(--muted); }

      ul { margin: 0; padding-left: 1.2em; font-size: var(--text-lead); }

      /* Result card: a ruled block, not a shadowed tile */
      .card { display: flex; flex-direction: column; gap: 8px; padding: var(--space-sm) 0 var(--space-md); border-bottom: 1px solid var(--rule); }
      .card-head { display: grid; grid-template-columns: 1fr auto; gap: var(--space-sm); align-items: start; }
      .card h3 { margin: 0; font-size: var(--text-lead); font-weight: 700; }
      .price { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
      .price .num { font-size: var(--text-section); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.19px; line-height: 1.1; }
      .card .meta { margin: 0; font-size: var(--text-body); }
      .card .evidence { margin: 0; padding-left: 12px; border-left: 2px solid var(--ink); color: var(--muted); }
      .card .saving { margin: 0; display: inline-block; padding: 2px 8px; background: var(--fm-accent); color: var(--fm-black); font-weight: 500; }
      .card .link { padding: 8px 0; }
      .cat p { grid-column: 1 / -1; }

      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .void { flex: 1; min-height: 72px; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        .primary:hover:not(:disabled) { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
