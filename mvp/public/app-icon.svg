<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">ALL IN LIFE futuristic A app icon</title>
  <defs>
    <radialGradient id="background" cx="28%" cy="18%" r="96%">
      <stop offset="0" stop-color="#17251e"/>
      <stop offset=".48" stop-color="#0b110e"/>
      <stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="49%" r="50%">
      <stop offset="0" stop-color="#d9ff43" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#36a8ff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#36a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="86" y1="92" x2="430" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9ff43"/>
      <stop offset=".52" stop-color="#36a8ff"/>
      <stop offset="1" stop-color="#6978ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="122" y1="397" x2="383" y2="113" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9ff43"/>
      <stop offset=".48" stop-color="#efffb7"/>
      <stop offset="1" stop-color="#52ddff"/>
    </linearGradient>
    <linearGradient id="edge" x1="249" y1="97" x2="391" y2="401" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5ffd0"/>
      <stop offset=".45" stop-color="#36a8ff"/>
      <stop offset="1" stop-color="#6978ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#d9ff43" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feFlood flood-color="#d9ff43" flood-opacity=".24"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#background)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <circle cx="256" cy="252" r="222" fill="url(#aura)"/>

    <path d="M88 230C101 142 169 76 256 76c51 0 97 21 130 55" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <path d="M424 282c-14 88-82 154-168 154-51 0-97-21-130-55" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <path d="M119 154H94v36" fill="none" stroke="#d9ff43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
    <path d="M393 350h25v-36" fill="none" stroke="#6978ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <circle cx="91" cy="214" r="7" fill="#d9ff43" filter="url(#nodeGlow)"/>
    <circle cx="421" cy="298" r="7" fill="#6978ff" filter="url(#nodeGlow)"/>

    <path d="M256 88 411 406h-78l-28-62h-98l-28 62h-78l128-293c6-15 15-25 27-25Zm0 125-29 73h58Z" fill="url(#mark)" fill-rule="evenodd" filter="url(#markGlow)"/>
    <path d="M277 104 404 393h-27L266 139Z" fill="url(#edge)" opacity=".86"/>
    <path d="M151 369h43l-16 37h-43Z" fill="#08100c"/>
    <path d="M180 344h27l-10 24h-28Z" fill="#6978ff" opacity=".95"/>
    <path d="M240 321h33l-10 23h-33Z" fill="#07100b"/>
    <path d="m256 242 16 16-16 16-16-16Z" fill="#0a100d" stroke="#36a8ff" stroke-width="4" filter="url(#nodeGlow)"/>
    <circle cx="256" cy="258" r="4" fill="#f4ffd3"/>

    <path d="M72 315v53c0 15 12 27 27 27h36" fill="none" stroke="#36a8ff" stroke-width="3" stroke-linecap="round" opacity=".32"/>
    <circle cx="72" cy="299" r="4" fill="#36a8ff" opacity=".7"/>
  </g>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#orbit)" stroke-opacity=".22" stroke-width="3"/>
</svg>
