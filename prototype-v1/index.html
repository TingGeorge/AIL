<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ALL in life" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <title>ALL in life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;700;900&family=Poppins:wght@500&display=swap" />
    <style>
      /* ALL in life — festival HUD. Black stage, acid-yellow signal, grid wall, badge dots. */
      :root {
        --black: #000000;
        --white: #ffffff;
        --off: #f5f5f5;
        --line: #e7e7e7;
        --control: #d9d9d9;
        --muted: #9a9a9a;
        --light-line: rgba(255, 255, 255, 0.3);
        --acid: #e4ff1a;
        --dot-blue: #3b7bff;
        --dot-red: #ff4b3e;
        --dot-yellow: #ffe14d;
        --stage-purple: rgba(96, 64, 255, 0.28);

        --font-display: "Unbounded", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        --font-btn: Poppins, "Noto Sans TC", sans-serif;

        --text-display: clamp(2.75rem, 12.5vw, 4.5rem);
        --text-section: clamp(1.6rem, 6vw, 2.1rem);
        --text-lead: clamp(1.15rem, 4.6vw, 1.35rem);
        --text-body: 1rem;
        --text-micro: 0.72rem;

        --gutter: clamp(20px, 5vw, 28px);
        --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px;

        --ink: var(--white);
        --surface: var(--black);
        --rule: var(--light-line);
        --grid: rgba(255, 255, 255, 0.07);
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--black);
        color: var(--white);
        font-family: var(--font-body);
        font-size: var(--text-body);
        line-height: 1.45;
        letter-spacing: -0.16px;
      }

      /* Stage */
      main {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        max-width: 430px;
        margin: 0 auto;
        min-height: 100dvh;
        padding: calc(var(--s3) + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right))
          calc(var(--s5) + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
        background-color: var(--surface);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      /* FM26 disc halo + stage light */
      main::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(circle at 88% 9%, rgba(228, 255, 26, 0.42) 0, rgba(228, 255, 26, 0.12) 22%, transparent 38%),
          radial-gradient(circle at 6% 100%, var(--stage-purple) 0, transparent 46%);
      }
      main[data-surface="white"] {
        --ink: var(--black);
        --surface: var(--white);
        --rule: var(--line);
        --grid: rgba(0, 0, 0, 0.045);
        --muted: #6a6a6a;
      }
      main[data-surface="white"]::before {
        background: radial-gradient(circle at 92% 2%, var(--acid) 0, var(--acid) 9%, transparent 9.5%);
      }

      /* Header bar */
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--s2);
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1;
      }
      .wordmark small {
        display: block;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-top: 4px;
      }
      .tag {
        display: inline-block;
        padding: 6px 12px;
        background: var(--acid);
        color: var(--black);
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        transform: rotate(-6deg);
        box-shadow: 4px 4px 0 var(--black), 5px 5px 0 var(--light-line);
        white-space: nowrap;
      }
      main[data-surface="white"] .tag { box-shadow: 4px 4px 0 var(--black); }

      /* Eyebrow: mono counter + dots */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-family: var(--font-mono);
        font-size: var(--text-micro);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pips { display: inline-flex; gap: 5px; }
      .pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .pip.blue { background: var(--dot-blue); }
      .pip.red { background: var(--dot-red); }
      .pip.yellow { background: var(--dot-yellow); }
      .pip.off { background: transparent; border: 1px solid var(--muted); }

      /* Display: outlined + filled, like the BUILDMODE wall */
      .display {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: var(--text-display);
        line-height: 1.05;
        letter-spacing: 0;
        text-wrap: balance;
      }
      .display .outline { color: var(--ink); }
      .display .fill { color: var(--acid); }
      main[data-surface="white"] .display .fill {
        color: var(--black);
        background: var(--acid);
        padding: 0 0.08em;
      }
      .lead { margin: 0; font-size: var(--text-lead); line-height: 1.45; font-weight: 400; white-space: pre-wrap; }
      .lead.quote {
        padding-left: 14px;
        border-left: 3px solid var(--acid);
        font-weight: 700;
      }
      .lead.quote + .lead.quote { margin-top: 10px; font-weight: 400; color: var(--muted); border-left-color: var(--dot-blue); }
      .note { margin: 0; font-family: var(--font-mono); font-size: var(--text-micro); line-height: 1.6; color: var(--muted); }
      .note.acid { color: var(--acid); }
      main[data-surface="white"] .note.acid { color: var(--black); }

      section { display: flex; flex-direction: column; gap: 12px; }

      /* HUD rows */
      .rows { border-top: 1px solid var(--rule); }
      .row {
        display: grid;
        grid-template-columns: 2.2em minmax(6em, 30%) 1fr;
        gap: var(--s2);
        align-items: center;
        min-height: 56px;
        padding: 10px 0;
        border-bottom: 1px solid var(--rule);
      }
      .row .idx { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--muted); letter-spacing: 0.08em; }
      .row > label, .row > .row-label { color: var(--muted); font-size: 0.9rem; }
      .row .value { font-size: var(--text-lead); font-weight: 700; font-variant-numeric: tabular-nums; }
      .row .value.unlimited { font-weight: 400; color: var(--muted); font-family: var(--font-mono); font-size: 0.9rem; letter-spacing: 0.06em; }
      .row input, .row select, textarea {
        width: 100%;
        min-height: 44px;
        font: inherit;
        font-size: var(--text-lead);
        font-weight: 700;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 2px solid var(--acid);
        border-radius: 0;
        padding: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .row select { -webkit-appearance: none; appearance: none; }
      textarea {
        font-size: var(--text-body);
        font-weight: 400;
        min-height: 112px;
        border: 1px solid var(--rule);
        padding: 12px;
        resize: vertical;
      }
      .row .link { justify-self: start; }

      /* Mic panel with HUD brackets */
      button { font: inherit; color: inherit; cursor: pointer; }
      .mic {
        position: relative;
        width: 100%;
        min-height: 150px;
        padding: var(--s2) var(--s2) var(--s3);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: stretch;
        gap: var(--s2);
        text-align: left;
        background: rgba(0, 0, 0, 0.6);
        color: var(--white);
        border: 1px solid var(--light-line);
        border-radius: 0;
        overflow: hidden;
        transition: background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
      }
      .mic::before, .mic::after {
        content: "";
        position: absolute;
        width: 18px; height: 18px;
        border: 2px solid var(--acid);
        pointer-events: none;
      }
      .mic::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
      .mic::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
      .mic-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .mic-top .rec { display: inline-flex; align-items: center; gap: 8px; }
      .mic-top .rec .pip { background: var(--dot-red); }
      .mic-text { font-family: var(--font-display); font-weight: 900; font-size: var(--text-section); line-height: 1.1; }
      .mic-kicker { font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
      .mic-bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0%; background: var(--black); transition: width 250ms linear; }
      .mic[data-recording="true"] { background: var(--acid); color: var(--black); border-color: var(--acid); }
      .mic[data-recording="true"] .mic-top, .mic[data-recording="true"] .mic-kicker { color: var(--black); }
      .mic[data-recording="true"]::before, .mic[data-recording="true"]::after { border-color: var(--black); }
      .mic[data-recording="true"] .rec .pip { animation: blink 900ms steps(2, start) infinite; }
      .mic:disabled { color: var(--muted); cursor: default; }
      .mic:disabled .mic-text { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes pulse { 50% { opacity: 0.45; } }

      /* CTAs */
      .primary {
        width: 100%;
        min-height: 56px;
        padding: 16px 20px;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        color: var(--black);
        background: var(--acid);
        border: 0;
        border-radius: 0;
        box-shadow: 6px 6px 0 rgba(255, 255, 255, 0.18);
        transition: transform 120ms ease-out, box-shadow 120ms ease-out, background 120ms ease-out;
      }
      main[data-surface="white"] .primary { box-shadow: 6px 6px 0 var(--black); }
      .primary:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 rgba(255, 255, 255, 0.18); }
      .primary:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(255, 255, 255, 0.18); }
      .primary:disabled { background: #3a3a3a; color: var(--muted); box-shadow: none; cursor: default; }
      .secondary {
        width: 100%;
        min-height: 48px;
        padding: 14px 20px;
        font-family: var(--font-btn);
        font-weight: 500;
        font-size: 0.9rem;
        letter-spacing: 0.29px;
        color: var(--black);
        background: var(--control);
        border: 0;
        border-radius: 10px;
      }
      .link {
        background: none;
        border: 0;
        padding: 12px 0;
        min-height: 44px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 4px;
        text-align: left;
      }
      .link.muted { color: var(--muted); }
      .link.acid { color: var(--acid); text-decoration: none; }
      .link.acid::before { content: "▶ "; font-size: 0.7em; }
      main[data-surface="white"] .link.acid { color: var(--black); text-decoration: underline; text-decoration-color: var(--acid); text-decoration-thickness: 3px; }

      .status { margin: 0; min-height: 22px; font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.04em; }
      .status.error { color: var(--acid); }
      main[data-surface="white"] .status.error { color: var(--dot-red); }

      /* Results: chip strip, category ledger, cards */
      .chips {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 14px 0;
        text-align: left;
        background: none;
        border: 0;
        border-top: 2px solid var(--black);
        border-bottom: 1px solid var(--black);
        border-radius: 0;
      }
      .chip { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.04em; padding: 4px 8px; border: 1px solid var(--black); }
      .chip:first-child { background: var(--black); color: var(--white); font-weight: 500; }
      .cat {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 18px 0 8px;
        border-bottom: 2px solid var(--black);
      }
      .cat .idx { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.1em; color: var(--muted); }
      .cat h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: var(--text-section); letter-spacing: -0.01em; }
      .cat .mark { font-family: var(--font-display); font-weight: 900; font-size: 0.72rem; padding: 4px 8px; background: var(--acid); color: var(--black); transform: rotate(-4deg); }
      .cat p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-family: var(--font-mono); font-size: 0.85rem; }

      .card { display: flex; flex-direction: column; gap: 8px; padding: 14px 0 18px; border-bottom: 1px solid var(--line); }
      .card-head { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); align-items: start; }
      .card h3 { margin: 0; font-size: var(--text-lead); font-weight: 900; line-height: 1.25; }
      .card .provider { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
      .price { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
      .price .num { font-family: var(--font-display); font-weight: 900; font-size: var(--text-section); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
      .price .num.free { color: var(--black); background: var(--acid); padding: 0 6px; }
      .price .unit { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--muted); margin-top: 6px; }
      .card .meta { margin: 0; font-size: 0.9rem; }
      .card .evidence { margin: 0; padding-left: 12px; border-left: 2px solid var(--black); color: #444; font-size: 0.9rem; }
      .card .status-line { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.06em; color: var(--muted); }
      .card .saving { margin: 0; display: inline-block; align-self: flex-start; padding: 4px 8px; background: var(--acid); color: var(--black); font-weight: 700; font-size: 0.9rem; }
      .card .link { padding: 6px 0; }

      ul { margin: 0; padding-left: 1.2em; font-size: var(--text-lead); }

      /* App chrome */
      .back { background: none; border: 0; padding: 8px 0; min-height: 44px; font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.06em; color: var(--ink); }
      .bar-right { display: inline-flex; align-items: center; gap: 14px; }
      .listbtn { background: none; border: 1px solid var(--rule); padding: 6px 10px; min-height: 36px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; color: var(--ink); }
      .listbtn b { display: inline-block; min-width: 1.4em; padding: 0 4px; margin-left: 4px; background: var(--acid); color: var(--black); text-align: center; font-weight: 700; }
      .display.small { font-size: var(--text-section); line-height: 1.2; }
      .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; padding: 10px 14px; background: var(--acid); color: var(--black); font-family: var(--font-mono); font-size: 0.85rem; box-shadow: 4px 4px 0 var(--black); animation: rise 240ms ease-out both; }
      .preview-note { position: fixed; top: 0; left: 0; right: 0; z-index: 9; text-align: center; padding: 4px; background: var(--dot-red); color: var(--white); }

      /* Search: agents */
      .agents { gap: var(--s2); }
      .agent { position: relative; overflow: hidden; padding: 14px 14px 18px; border: 1px solid var(--light-line); display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.5); }
      .agent.done { border-color: var(--acid); }
      .agent.failed { border-color: var(--dot-red); }
      .agent-head { display: flex; justify-content: space-between; align-items: center; }
      .agent-head .eyebrow { color: var(--white); }
      .agent-zh { font-size: 0.85rem; color: var(--muted); }
      .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 0.78rem; color: var(--muted); }
      .steps li { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; border-top: 2px solid var(--light-line); }
      .steps li.past { border-top-color: var(--white); color: var(--white); }
      .steps li.now { border-top-color: var(--acid); color: var(--acid); }
      .steps .idx { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.08em; }
      .agent-foot { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.04em; color: var(--muted); }
      .agent-foot .num { font-family: var(--font-display); font-size: 1.1rem; color: var(--white); font-variant-numeric: tabular-nums; margin-left: 4px; }
      .agent-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--acid); transition: width 480ms ease-out; }
      .agent.failed .agent-bar { background: var(--dot-red); }
      .pip.live { animation: blink 900ms steps(2, start) infinite; }

      /* Results: tabs, folds, empty */
      .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter) 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; background: none; border: 1px solid var(--black); border-radius: 0; font-size: 0.9rem; font-weight: 700; white-space: nowrap; }
      .tab b { font-family: var(--font-mono); font-weight: 500; font-size: 0.75rem; color: var(--muted); }
      .tab.rel { border-bottom: 3px solid var(--acid); }
      .tab.on { background: var(--black); color: var(--white); }
      .tab.on b { color: var(--acid); }
      .fold { border-top: 2px solid var(--black); padding-top: 8px; }
      .fold summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 44px; font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.04em; }
      .fold summary::-webkit-details-marker { display: none; }
      .fold summary::before { content: "+"; font-family: var(--font-display); font-weight: 900; }
      .fold[open] summary::before { content: "−"; }
      .fold summary b { padding: 0 6px; background: var(--black); color: var(--white); }
      .fold .secondary { margin: 8px 0; }
      .empty { display: flex; flex-direction: column; gap: 10px; padding: 18px 0; border-bottom: 1px solid var(--line); }
      .status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.06em; color: var(--muted); }
      .card { cursor: pointer; }
      .card:hover h3, .card:focus-visible h3 { text-decoration: underline; text-decoration-color: var(--acid); text-decoration-thickness: 3px; }

      /* Detail + list */
      .row.total { border-bottom: 2px solid var(--ink); }
      .row.total .value { font-family: var(--font-display); font-size: var(--text-section); line-height: 1; }
      .row .value.free { color: var(--black); background: var(--acid); padding: 0 6px; justify-self: start; }
      .row .value.over { color: var(--dot-red); }
      .row .value .saving { display: inline-block; padding: 2px 8px; background: var(--acid); color: var(--black); font-size: 1rem; font-family: var(--font-body); }
      .list-row { grid-template-columns: 1fr auto auto; }
      .list-row .link { padding: 4px 0; font-family: var(--font-body); font-weight: 700; font-size: var(--text-body); text-decoration: none; }
      .actions { gap: 10px; }
      .action-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .report { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--light-line); }
      .radio { display: flex; align-items: center; gap: 10px; min-height: 40px; }
      .radio input { accent-color: var(--acid); width: 18px; height: 18px; }
      a.link { display: inline-block; }

      /* Settings, team, community */
      .gear { background: none; border: 1px solid var(--rule); min-width: 36px; min-height: 36px; font-size: 1rem; color: var(--ink); }
      main[data-survival="1"] .tag { background: var(--dot-red); color: var(--white); }
      .modechip { margin-left: 10px; padding: 2px 8px; background: var(--dot-red); color: var(--white); font-weight: 500; letter-spacing: 0.08em; }
      .profile { display: flex; align-items: center; gap: 12px; }
      .profile input { flex: 1; min-height: 48px; font: inherit; font-size: var(--text-lead); font-weight: 700; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--acid); border-radius: 0; padding: 6px 0; }
      .avatar { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--black); font-family: var(--font-display); font-weight: 900; }
      .dots { display: flex; gap: 10px; }
      .dot { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; }
      .dot.on { border-color: var(--white); box-shadow: 0 0 0 2px var(--black); }
      .meter { position: relative; height: 22px; border: 1px solid var(--light-line); background: rgba(0,0,0,0.5); }
      .meter span { display: block; height: 100%; background: var(--acid); transition: width 480ms ease-out; }
      .meter b { position: absolute; right: 8px; top: 0; line-height: 22px; font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.08em; color: var(--white); mix-blend-mode: difference; }
      .switch { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; text-align: left; background: rgba(0,0,0,0.5); border: 1px solid var(--light-line); border-radius: 0; }
      .switch.on { border-color: var(--dot-red); }
      .switch .knob { flex: 0 0 auto; width: 52px; height: 30px; border: 2px solid var(--white); position: relative; }
      .switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--white); transition: transform 160ms ease-out, background 160ms ease-out; }
      .switch.on .knob { border-color: var(--dot-red); }
      .switch.on .knob::after { transform: translateX(22px); background: var(--dot-red); }
      .switch-text { display: flex; flex-direction: column; gap: 4px; }
      .switch-text b { font-family: var(--font-display); font-weight: 900; font-size: 1rem; }
      .switch-text small { color: var(--muted); font-size: 0.85rem; }
      .chipset { display: flex; flex-wrap: wrap; gap: 8px; }
      .pick { min-height: 40px; padding: 6px 14px; background: transparent; border: 1px solid var(--rule); border-radius: 0; font-weight: 700; color: var(--ink); }
      .pick.on { background: var(--acid); border-color: var(--acid); color: var(--black); }
      .pick.on.red { background: var(--dot-red); border-color: var(--dot-red); color: var(--white); }
      .pick small { font-family: var(--font-mono); font-weight: 400; font-size: 0.65rem; letter-spacing: 0.06em; margin-left: 4px; opacity: 0.85; }
      .group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      .group-label { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.12em; color: var(--acid); }
      .fromtag { display: inline-block; margin-left: 6px; padding: 1px 6px; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; background: var(--dot-blue); color: var(--white); vertical-align: middle; }
      .code { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 8vw, 2.4rem); letter-spacing: 0.08em; padding: 16px; border: 2px dashed var(--acid); text-align: center; font-variant-numeric: tabular-nums; }
      .members { display: flex; flex-wrap: wrap; gap: 10px; }
      .member { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid var(--light-line); font-weight: 700; }
      .member .avatar { width: 28px; height: 28px; font-size: 0.85rem; }
      .member.ghost { color: var(--muted); font-weight: 400; border-style: dashed; }
      .member.ghost .avatar { background: transparent; border: 1px dashed var(--muted); }
      .count { font-family: var(--font-mono); font-weight: 500; margin-left: 6px; color: var(--white); }
      .groupbox { padding: 14px; border: 2px solid var(--acid); }
      .tagsrow { display: flex; flex-wrap: wrap; gap: 6px; }
      .tagsrow:empty { display: none; }
      .grouptag { display: inline-block; padding: 3px 8px; background: var(--black); color: var(--acid); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; transform: rotate(-2deg); }
      .warntag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--dot-red); color: var(--dot-red); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; }
      .warntag.big { font-size: 0.8rem; padding: 8px 10px; margin: 0; }
      .untagged { margin-left: 8px; padding: 1px 6px; border: 1px dashed var(--muted); }
      .freetag { display: inline-block; padding: 2px 10px; background: var(--acid); color: var(--black); font-family: var(--font-display); font-weight: 900; font-size: 1.1rem; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--black); }
      .chip.red { border-color: var(--dot-red); color: var(--dot-red); }
      .reports { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
      .reports li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
      .reports li small { flex-basis: 100%; font-family: var(--font-mono); font-size: var(--text-micro); color: var(--muted); }
      .reports li.exp b { color: var(--dot-red); }
      .report input { min-height: 44px; font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--light-line); padding: 6px 0; }
      .list-actions { display: flex; gap: 12px; }
      .list-row { grid-template-columns: 1fr auto auto; }

      /* Polish: idle mic ring, agent ticker, selected tab, slide-in */
      .mic:not(:disabled):not([data-recording="true"]) { animation: ring 2.4s ease-out infinite; }
      @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(228,255,26,0.45); } 70% { box-shadow: 0 0 0 14px rgba(228,255,26,0); } 100% { box-shadow: 0 0 0 0 rgba(228,255,26,0); } }
      .agent-name { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 0.95rem; }
      .ticker { overflow: hidden; white-space: nowrap; font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.08em; color: var(--muted); border-top: 1px dashed var(--light-line); border-bottom: 1px dashed var(--light-line); padding: 4px 0; }
      .ticker span { display: inline-block; animation: marquee 12s linear infinite; }
      .ticker i { font-style: normal; margin-right: 24px; }
      .ticker i::before { content: "▸ "; color: var(--acid); }
      @keyframes marquee { to { transform: translateX(-50%); } }
      .tab.on { background: var(--acid); color: var(--black); border-color: var(--acid); }
      .tab.on b { color: var(--black); }
      main { animation: slidein 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      @keyframes slidein { from { opacity: 0; transform: translateX(18px); } }
      @media (prefers-reduced-motion: reduce) { .ticker span { animation: none; } main { animation: none; } }

      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--acid);
        outline-offset: 3px;
      }
      main[data-surface="white"] :is(button, input, select, textarea):focus-visible { outline-color: var(--black); }

      .void { flex: 1; min-height: 56px; }

      /* Entrance: staggered rise */
      .rise { animation: rise 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .rise:nth-child(2) { animation-delay: 60ms; }
      .rise:nth-child(3) { animation-delay: 120ms; }
      .rise:nth-child(4) { animation-delay: 180ms; }
      .rise:nth-child(5) { animation-delay: 240ms; }
      .rise:nth-child(6) { animation-delay: 300ms; }
      .rise:nth-child(7) { animation-delay: 360ms; }
      .rise:nth-child(n+8) { animation-delay: 420ms; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

      @media (min-width: 768px) {
        body { padding: 32px 0; }
        main {
          min-height: min(100dvh - 64px, 900px);
          border-left: 1px solid var(--light-line);
          border-right: 1px solid var(--light-line);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .rise { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
