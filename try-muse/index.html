  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))};

  if(!costcoOk&&r.eligibility.includes("Costco 會員"))o.push("costco");

  for(const p of["素食","不排隊","近捷運"])if(t.includes(p)&&!n.soft_preferences.includes(p))n.soft_preferences.push(p);

// ---- 自檢：?check=1 時跑斷言（ponytail: 非-trivial 邏輯留 ONE runnable check） ----
function selfCheck(){const A=[];
  const eq=(n,a,b)=>A.push([n,JSON.stringify(a)===JSON.stringify(b),JSON.stringify(a)]);
  eq("total 含必要費用與折扣",total({price_total_twd:399,mandatory_fees_twd:40,discount_twd:0}),439);
  eq("未知價格不當 0",total({price_total_twd:null,mandatory_fees_twd:0,discount_twd:0}),null);
  eq("未知價格進 pending",gate(DATA.find(r=>r.id==="d_dish")),false);
  eq("過期退出主要排序",expired(DATA.find(r=>r.id==="r_yoga")),true);
  const n1={budget_total_twd:300,free_only:false,max_distance_km:null,max_minutes:null,registration_ok:null,exclude_tags:[]};
  const f1={...DATA.find(r=>r.id==="f_bd01"),distance_km:null},f3={...DATA.find(r=>r.id==="f_pot"),distance_km:null};
  eq("260 過 300 預算",violations(f1,n1,[],true),[]);
  eq("439 被預算擋下",violations(f3,n1,[],true),["budget"]);
  eq("免費限定擋付費",violations(f1,{...n1,free_only:true},[],true),["free_only"]);
  eq("排除牛擋鍋物",violations({...f3,tags:["牛"]},n1,["牛"],true),["budget","exclude"]);
  eq("未開會員擋 Costco",violations({...f1,eligibility:["Costco 會員"]},n1,[],false),["costco"]);
  eq("haversine 車站→101 約 5km",Math.abs(hav({lat:25.0478,lng:121.517},{lat:25.034,lng:121.5645})-5.03)<0.1,true);
  eq("步行換算",walk(1.6),20);
  const p=parseNeed("今天晚餐兩個人預算三百圓山區二十分鐘內可以外帶",null);
  eq("解析情境A",[p.need,p.people_or_servings,p.budget_total_twd,p.max_minutes,p.date,p.soft_preferences],["晚餐",2,300,20,"2026-09-05",["可外帶"]]);
  const d=parseNeed("改成三個人",p);eq("修正語句只改人數",[d.people_or_servings,d.budget_total_twd],[3,300]);
  const u=parseNeed("晚餐兩個人靠近捷運站",null);eq("unresolved 不猜",u.unresolved,["靠近捷運站"]);
  return A}
// ---- 路由 ----
function route(){tabs();const h=location.hash||"#/";
  if(h==="#/")vHome();else if(h==="#/confirm")vConfirm();else if(h==="#/searching")vSearching();
  else if(h==="#/dash")vDash();else if(h.startsWith("#/detail"))vDetail(new URLSearchParams(h.split("?")[1]).get("id"));
  else if(h==="#/list")vList();else if(h==="#/budget")vBudget();else if(h==="#/auth")vAuth();else vHome();
  if(new URLSearchParams(location.search).get("check")==="1"&&(h==="#/"||!h)){const A=selfCheck();
    const bad=A.filter(x=>!x[1]); // ponytail: insertAdjacentHTML 才不會清掉已綁定的 onclick
    view.insertAdjacentHTML("beforeend",`<div class="card ${bad.length?"":"hl"}"><b>self-check：${A.length-bad.length}/${A.length} 通過</b>`+
    A.map(([n,ok,v])=>`<div class="small ${ok?"neon":"red"}">${ok?"✓":"✗"} ${n}${ok?"":" · "+v}</div>`).join("")+"</div>")}}
window.addEventListener("hashchange",route);route();
